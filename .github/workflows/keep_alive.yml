name: Keep Render Backend Alive

on:
  schedule:
    # Chạy mỗi 14 phút để ngăn Render Free Web Service rơi vào trạng thái ngủ (Sleep sau 15 phút không hoạt động)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Cho phép bấm "Run workflow" thủ công trên giao diện GitHub Actions

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AOV Coach Render Backend
        run: |
          echo "Sending keep-alive ping to Render backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 https://aov-backend-khang.onrender.com/ping || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Server is online and active!"
          else
            echo "⚠️ Server was cold starting or returned status $HTTP_STATUS"
          fi

